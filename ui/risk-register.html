<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Register — Marineso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --accent: #00d4aa;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --border: #2d313e;
            --critical: #ef4444;
            --high: #f59e0b;
            --medium: #3b82f6;
            --low: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        header h1 { font-size: 24px; font-weight: 700; color: #fff; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 600; }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }
        .btn {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { border-color: var(--accent); }
        .btn.primary { background: var(--accent); color: var(--bg); border: none; }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .val { font-size: 32px; font-weight: 700; display: block; margin-bottom: 4px; }
        .stat-card .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-card.critical .val { color: var(--critical); }
        .stat-card.high .val { color: var(--high); }
        .stat-card.medium .val { color: var(--medium); }
        .stat-card.low .val { color: var(--low); }

        /* Matrix and Table Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        /* Risk Matrix */
        .matrix-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            height: fit-content;
        }
        .matrix-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; text-align: center; }
        .matrix-grid {
            display: grid;
            grid-template-columns: 30px repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr) 30px;
            gap: 4px;
            width: 100%;
            aspect-ratio: 1;
        }
        .matrix-cell {
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            position: relative;
        }
        /* Heatmap colors */
        .c-1 { background: rgba(16, 185, 129, 0.2); }
        .c-2 { background: rgba(16, 185, 129, 0.4); }
        .c-3 { background: rgba(245, 158, 11, 0.3); }
        .c-4 { background: rgba(245, 158, 11, 0.5); }
        .c-5 { background: rgba(239, 68, 68, 0.4); }
        .c-6 { background: rgba(239, 68, 68, 0.6); }

        .axis-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--muted);
            font-weight: 600;
        }
        .v-label { writing-mode: vertical-rl; transform: rotate(180deg); }

        .risk-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Risk Table */
        .table-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: var(--bg); text-align: left; padding: 12px 16px; color: var(--muted); font-weight: 600; }
        td { padding: 14px 16px; border-top: 1px solid var(--border); }
        tr:hover { background: rgba(255,255,255,0.02); cursor: pointer; }
        
        .score-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 11px;
        }
        .score-critical { background: var(--critical); color: #fff; }
        .score-high { background: var(--high); color: #fff; }
        .score-medium { background: var(--medium); color: #fff; }
        .score-low { background: var(--low); color: #fff; }

        .status-pill {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            border: 1px solid;
        }
        .status-open { color: var(--critical); border-color: var(--critical); }
        .status-in_progress { color: var(--high); border-color: var(--high); }
        .status-resolved { color: var(--low); border-color: var(--low); }
        .status-accepted { color: var(--muted); border-color: var(--muted); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full { grid-column: span 2; }
        label { font-size: 12px; color: var(--muted); font-weight: 600; }
        input, select, textarea {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
        }
        textarea { height: 80px; resize: vertical; }

        .toast {
            position: fixed; bottom: 20px; right: 20px; background: var(--card);
            border: 1px solid var(--border); padding: 16px 24px; border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1000; display: none;
        }

        /* ── Горизонтальная навигация ── */
        .top-nav {
            display: flex; align-items: center; gap: 4px; flex: 1; overflow-x: auto;
            scrollbar-width: none; margin-left: 12px;
        }
        .top-nav::-webkit-scrollbar { display: none; }
        .top-nav a {
            display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px;
            color: var(--muted); text-decoration: none; border-radius: 6px;
            font-size: 12px; font-weight: 500; white-space: nowrap; transition: all .15s;
        }
        .top-nav a:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .top-nav a.active { background: rgba(0,212,170,.15); color: var(--accent); }
        .top-nav .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚠️ Risk Register</h1>
            <!-- Горизонтальная навигация по разделам платформы -->
            <nav class="top-nav" id="topNav">
                <a href="/">📊 Dashboard</a>
                <span class="nav-sep"></span>
                <a href="/training">🎓 Training</a>
                <a href="/background-checks">👤 BG Checks</a>
                <span class="nav-sep"></span>
                <a href="/vulnerabilities">🔒 Vulns</a>
                <a href="/pentests">🔍 Pen Tests</a>
                <a href="/risk-register" class="active">⚠️ Risk Register</a>
                <span class="nav-sep"></span>
                <a href="/audit-timeline">📅 Timeline</a>
                <a href="/questionnaires">📋 Questionnaires</a>
                <span class="nav-sep"></span>
                <a href="/access-review">👥 Access Review</a>
                <a href="/auditor-portal">🔎 Auditor</a>
                <span class="nav-sep"></span>
                <a href="/trust" target="_blank" rel="noopener">🛡️ Trust ↗</a>
            </nav>
        </header>

        <div class="toolbar">
            <button class="btn primary" onclick="syncRisks()">🔄 Sync from Controls</button>
            <button class="btn" onclick="openModal()">+ Add Manual Risk</button>
            <div style="flex: 1;"></div>
            <select class="btn" id="filterStatus" onchange="loadRisks()">
                <option value="">All Statuses</option>
                <option value="open">Open</option>
                <option value="in_progress">In Progress</option>
                <option value="resolved">Resolved</option>
                <option value="accepted">Accepted</option>
            </select>
        </div>

        <div class="summary-grid">
            <div class="stat-card critical">
                <span class="val" id="statCritical">0</span>
                <span class="lbl">Critical</span>
            </div>
            <div class="stat-card high">
                <span class="val" id="statHigh">0</span>
                <span class="lbl">High</span>
            </div>
            <div class="stat-card medium">
                <span class="val" id="statMedium">0</span>
                <span class="lbl">Medium</span>
            </div>
            <div class="stat-card low">
                <span class="val" id="statLow">0</span>
                <span class="lbl">Low</span>
            </div>
        </div>

        <div class="main-layout">
            <div class="matrix-container">
                <div class="matrix-title">Likelihood vs Impact</div>
                <div class="matrix-grid" id="matrixGrid">
                    <!-- Grid generated by JS -->
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 10px; padding-left: 30px;">
                    <span>Negligible</span>
                    <span>Critical</span>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Score</th>
                            <th>Status</th>
                            <th>Target Date</th>
                        </tr>
                    </thead>
                    <tbody id="riskTableContent">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit/Add Modal -->
    <div class="modal" id="riskModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Risk</h2>
            <form id="riskForm">
                <input type="hidden" id="riskId">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group full">
                        <label>Description</label>
                        <textarea id="description"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Likelihood (1-5)</label>
                        <select id="likelihood" onchange="updateScore()">
                            <option value="1">1 - Rare</option>
                            <option value="2">2 - Unlikely</option>
                            <option value="3">3 - Possible</option>
                            <option value="4">4 - Likely</option>
                            <option value="5">5 - Almost Certain</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Impact (1-5)</label>
                        <select id="impact" onchange="updateScore()">
                            <option value="1">1 - Negligible</option>
                            <option value="2">2 - Minor</option>
                            <option value="3">3 - Moderate</option>
                            <option value="4">4 - Major</option>
                            <option value="5">5 - Critical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Risk Score</label>
                        <div id="scorePreview" style="font-size: 24px; font-weight: 700; color: var(--accent);">9</div>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category">
                            <option value="access_control">Access Control</option>
                            <option value="data_protection">Data Protection</option>
                            <option value="change_management">Change Management</option>
                            <option value="vendor">Vendor Risk</option>
                            <option value="operational">Operational</option>
                            <option value="compliance">Compliance</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Owner</label>
                        <input type="email" id="owner" value="ciso@marineso.com">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="open">Open</option>
                            <option value="in_progress">In Progress</option>
                            <option value="resolved">Resolved</option>
                            <option value="accepted">Accepted</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Treatment</label>
                        <select id="treatment">
                            <option value="mitigate">Mitigate</option>
                            <option value="accept">Accept</option>
                            <option value="transfer">Transfer</option>
                            <option value="avoid">Avoid</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Target Date</label>
                        <input type="date" id="target_date">
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 30px;">
                    <button type="submit" class="btn primary" style="flex: 1;">Save Risk</button>
                    <button type="button" class="btn" style="flex: 1;" onclick="closeModal()">Cancel</button>
                    <button type="button" id="deleteBtn" class="btn" style="color: var(--critical); border-color: var(--critical); display: none;" onclick="deleteRisk()">Delete</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        async function init() {
            // Check auth
            const r = await fetch('/api/auth/me');
            if (r.status === 401) { window.location.href = '/login'; return; }
            
            await loadSummary();
            await loadRisks();
            renderMatrix();
        }

        async function loadSummary() {
            const r = await fetch('/api/risks/summary');
            const data = await r.json();
            document.getElementById('statCritical').innerText = data.critical_count;
            document.getElementById('statHigh').innerText = data.high_count;
            document.getElementById('statMedium').innerText = data.medium_count;
            document.getElementById('statLow').innerText = data.low_count;
        }

        async function loadRisks() {
            const status = document.getElementById('filterStatus').value;
            const r = await fetch(`/api/risks${status ? '?status='+status : ''}`);
            const risks = await r.json();
            
            const content = document.getElementById('riskTableContent');
            content.innerHTML = risks.map(r => `
                <tr onclick="editRisk('${r.id}')">
                    <td style="font-family: monospace; color: var(--accent);">${r.id}</td>
                    <td style="font-weight: 500;">${r.title}</td>
                    <td style="color: var(--muted); text-transform: capitalize;">${r.category.replace('_', ' ')}</td>
                    <td>
                        <span class="score-badge ${getScoreClass(r.risk_score)}">${r.risk_score}</span>
                    </td>
                    <td>
                        <span class="status-pill status-${r.status}">${r.status.replace('_', ' ')}</span>
                    </td>
                    <td style="color: var(--muted);">${r.target_date || '—'}</td>
                </tr>
            `).join('');
            
            updateMatrixPoints(risks);
        }

        function getScoreClass(score) {
            if (score >= 20) return 'score-critical';
            if (score >= 15) return 'score-high';
            if (score >= 8) return 'score-medium';
            return 'score-low';
        }

        function renderMatrix() {
            const grid = document.getElementById('matrixGrid');
            grid.innerHTML = '';
            
            // Likelihood labels (5 to 1)
            for (let l = 5; l >= 1; l--) {
                grid.innerHTML += `<div class="axis-label">${l}</div>`;
                for (let i = 1; i <= 5; i++) {
                    const heat = l + i; // Simple heat map logic
                    let heatClass = 'c-1';
                    if (heat >= 9) heatClass = 'c-6';
                    else if (heat >= 7) heatClass = 'c-4';
                    else if (heat >= 5) heatClass = 'c-3';
                    else if (heat >= 3) heatClass = 'c-2';
                    
                    grid.innerHTML += `<div class="matrix-cell ${heatClass}" id="cell-${l}-${i}"></div>`;
                }
            }
            
            // Impact labels (1 to 5)
            grid.innerHTML += '<div></div>'; // Corner
            for (let i = 1; i <= 5; i++) {
                grid.innerHTML += `<div class="axis-label">${i}</div>`;
            }
        }

        function updateMatrixPoints(risks) {
            // Clear dots
            document.querySelectorAll('.matrix-cell').forEach(c => c.innerHTML = '');
            
            risks.forEach(r => {
                if (r.status === 'resolved') return;
                const cell = document.getElementById(`cell-${r.likelihood}-${r.impact}`);
                if (cell) {
                    const dot = document.createElement('div');
                    dot.className = 'risk-dot';
                    dot.title = r.id + ': ' + r.title;
                    cell.appendChild(dot);
                }
            });
        }

        async function syncRisks() {
            showToast("Syncing with controls...", "info");
            const r = await fetch('/api/risks/sync', { method: 'POST' });
            const res = await r.json();
            showToast(`Sync complete: ${res.created} created, ${res.skipped} existing.`, "success");
            loadSummary();
            loadRisks();
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = "Add Risk";
            document.getElementById('riskForm').reset();
            document.getElementById('riskId').value = '';
            document.getElementById('deleteBtn').style.display = 'none';
            document.getElementById('riskModal').style.display = 'flex';
            updateScore();
        }

        async function editRisk(id) {
            const r = await fetch(`/api/risks/${id}`);
            const risk = await r.json();
            
            document.getElementById('modalTitle').innerText = "Edit Risk " + id;
            document.getElementById('riskId').value = risk.id;
            document.getElementById('title').value = risk.title;
            document.getElementById('description').value = risk.description;
            document.getElementById('likelihood').value = risk.likelihood;
            document.getElementById('impact').value = risk.impact;
            document.getElementById('category').value = risk.category;
            document.getElementById('owner').value = risk.owner;
            document.getElementById('status').value = risk.status;
            document.getElementById('treatment').value = risk.treatment;
            document.getElementById('target_date').value = risk.target_date || '';
            
            document.getElementById('deleteBtn').style.display = 'block';
            document.getElementById('riskModal').style.display = 'flex';
            updateScore();
        }

        function closeModal() {
            document.getElementById('riskModal').style.display = 'none';
        }

        function updateScore() {
            const l = parseInt(document.getElementById('likelihood').value);
            const i = parseInt(document.getElementById('impact').value);
            const score = l * i;
            const el = document.getElementById('scorePreview');
            el.innerText = score;
            
            if (score >= 20) el.style.color = 'var(--critical)';
            else if (score >= 15) el.style.color = 'var(--high)';
            else if (score >= 8) el.style.color = 'var(--medium)';
            else el.style.color = 'var(--low)';
        }

        document.getElementById('riskForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('riskId').value;
            const data = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                likelihood: parseInt(document.getElementById('likelihood').value),
                impact: parseInt(document.getElementById('impact').value),
                category: document.getElementById('category').value,
                owner: document.getElementById('owner').value,
                status: document.getElementById('status').value,
                treatment: document.getElementById('treatment').value,
                target_date: document.getElementById('target_date').value
            };

            const url = id ? `/api/risks/${id}` : '/api/risks';
            const method = id ? 'PATCH' : 'POST';

            const r = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (r.ok) {
                closeModal();
                loadSummary();
                loadRisks();
                showToast(id ? "Risk updated" : "Risk created", "success");
            } else {
                showToast("Error saving risk", "error");
            }
        };

        async function deleteRisk() {
            const id = document.getElementById('riskId').value;
            if (!confirm(`Delete risk ${id}?`)) return;
            
            const r = await fetch(`/api/risks/${id}`, { method: 'DELETE' });
            if (r.ok) {
                closeModal();
                loadSummary();
                loadRisks();
                showToast("Risk deleted", "success");
            }
        }

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            t.style.borderColor = type === 'success' ? 'var(--pass)' : 'var(--fail)';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        window.onload = init;
    </script>
</body>
</html>
